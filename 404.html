<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Matemáticas.top</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #06b6d4;
            --accent-color: #f59e0b;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --background: #ffffff;
            --background-secondary: #f9fafb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .error-container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, var(--accent-color), #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .error-title {
            font-size: 2rem;
            font-family: 'Poppins', sans-serif;
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1.125rem;
            margin-bottom: 2rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 1.5rem;
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 0 0.5rem;
        }

        .btn:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .math-formula {
            position: absolute;
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.3);
            animation: float 6s ease-in-out infinite;
        }

        .formula-1 {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .formula-2 {
            top: 30%;
            right: 15%;
            animation-delay: 2s;
        }

        .formula-3 {
            bottom: 25%;
            left: 15%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-20px);
                opacity: 0.6;
            }
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 4rem;
            }
            
            .error-title {
                font-size: 1.5rem;
            }
            
            .btn {
                display: block;
                margin: 0.5rem 0;
            }
            
            .math-formula {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="math-formula formula-1">x² + y² = r²</div>
    <div class="math-formula formula-2">∫ f(x)dx</div>
    <div class="math-formula formula-3">lim f(x)</div>

    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">¡Ups! Esta página no existe</h1>
        <p class="error-message">
            Parece que te has perdido en el mundo de las matemáticas. 
            No te preocupes, te ayudamos a encontrar el camino de vuelta.
        </p>
        <div>
            <a href="/" class="btn">
                <i class="fas fa-home"></i>
                Volver al Inicio
            </a>
            <a href="/#contacto" class="btn btn-outline">
                <i class="fas fa-envelope"></i>
                Contactar
            </a>
        </div>
    </div>
</body>
</html>
